# --- 核心快捷键 / Core shortcuts ---
macos-option-as-alt = true
# keybind = alt+left=esc:b
# keybind = alt+right=esc:f
# keybind = cmd+left=text:\x01
# keybind = cmd+right=text:\x05
# keybind = alt+backspace=text:\x17
# keybind = cmd+k=clear_screen
keybind = alt+backspace=text:\x1b\x7f
keybind = shift+enter=text:\n


# keybind = super+c=copy_to_clipboard
# keybind = super+v=paste_from_clipboard
# keybind = super+t=new_tab
# keybind = super+w=close_tab:this
# keybind = super+n=new_window
# keybind = super+shift+p=toggle_command_palette
keybind = ctrl+enter=toggle_fullscreen

# 标签页 / Tabs
keybind = super+bracket_left=previous_tab
keybind = super+bracket_right=next_tab
keybind = super+ctrl+bracket_left=move_tab:-1
keybind = super+ctrl+bracket_right=move_tab:1
# keybind = super+1=goto_tab:1
# keybind = super+2=goto_tab:2
# keybind = super+3=goto_tab:3
# keybind = super+4=goto_tab:4
# keybind = super+5=goto_tab:5

# 滚动控制 / Scroll controls
keybind = super+ctrl+y=scroll_page_lines:-1
keybind = super+ctrl+e=scroll_page_lines:1
keybind = super+ctrl+f=scroll_page_fractional:-0.5
keybind = super+ctrl+b=scroll_page_fractional:0.5

# --- Leader 模式：Ctrl+Space / Leader mode: Ctrl+Space ---
# 分屏创建（尽量贴近 WezTerm：leader+" 与 leader+%） / Split creation
keybind = ctrl+space>shift+quote=new_split:down
keybind = ctrl+space>shift+5=new_split:right

# 兼容备用键（便于非 US 键盘） / Fallback keys (useful on non-US layouts)
keybind = ctrl+space>v=new_split:down
keybind = ctrl+space>s=new_split:right

# 分屏导航 / Split navigation
keybind = ctrl+space>h=goto_split:left
keybind = ctrl+space>j=goto_split:down
keybind = ctrl+space>k=goto_split:up
keybind = ctrl+space>l=goto_split:right

# 分屏操作 / Split actions
keybind = ctrl+space>z=toggle_split_zoom
keybind = ctrl+space>e=equalize_splits
keybind = ctrl+space>x=close_surface

# 字号调整子序列（leader+f 后按 j/k/r） / Font resize mini-table (leader+f then j/k/r)
keybind = ctrl+space>f>k=increase_font_size:1
keybind = ctrl+space>f>j=decrease_font_size:1
keybind = ctrl+space>f>r=reset_font_size

# 窗格尺寸调整子序列（leader+p 后按 hjkl） / Pane resize mini-table (leader+p then hjkl)
keybind = ctrl+space>p>h=resize_split:left,10
keybind = ctrl+space>p>j=resize_split:down,10
keybind = ctrl+space>p>k=resize_split:up,10
keybind = ctrl+space>p>l=resize_split:right,10

# 便捷功能 / Convenience
keybind = super+shift+,=reload_config
# keybind = global:ctrl+comma=toggle_quick_terminal
