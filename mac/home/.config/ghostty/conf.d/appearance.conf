# --- 主题与外观 / Theme and look ---
# 主题（内置几百款，用 ghostty +list-themes 查看）
theme = Catppuccin Macchiato
background-opacity = 0.9
background-blur-radius = 20
unfocused-split-opacity = 0.5
macos-titlebar-style = transparent

# --- 字体 / Fonts ---
# font-family = MonaspiceKr NFM
# font-family = LXGW WenKai Mono
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-thicken = true

# 字体特性
# font-feature = calt
# font-feature = liga
# font-feature = dlig
# font-feature = ss01
# font-feature = ss02
# font-feature = ss03
# font-feature = ss04
# font-feature = ss05=0
# font-feature = ss06
# font-feature = ss07
# font-feature = ss08

# 窗口内边距 / Window padding
window-padding-x = 2
window-padding-y = 2
window-save-state = always

# 光标样式 / Cursor style
cursor-style = bar
cursor-style-blink = true

# --- Mouse ---
mouse-hide-while-typing = true
copy-on-select = clipboard

# --- Shell 与运行行为 / Shell and runtime behavior ---
# See https://ghostty.org/docs/help/terminfo#ssh
shell-integration-features = ssh-terminfo

# command = /opt/homebrew/bin/zsh -l
working-directory = /Users/richard/Downloads
confirm-close-surface = false

# 快速终端显示设置 / Quick terminal display settings
quick-terminal-position = top
quick-terminal-size = 100%

# 近似 WezTerm scrollback_lines=20000（Ghostty 按字节） / Approximate WezTerm scrollback_lines=20000 (Ghostty uses bytes)
# scrollback-limit = 50000000
# Generous scrollback (25MB)
scrollback-limit = 25000000
